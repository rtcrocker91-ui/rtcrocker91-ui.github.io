<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Dancing Tomato Studio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --ink:#2A3540;
  --muted:#8A9AA0;
  --accent:#4A6070;
  --border:#D0D8DC;
  --serif:'EB Garamond',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
}

html, body {
  height:100%;
  background:#fff;
  font-family:var(--sans);
  font-weight:300;
  color:var(--ink);
}

/* NAV */
nav {
  padding:1rem 2.5rem;
  border-bottom:0.5px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.nav-logo { font-family:var(--serif); font-size:1rem; color:var(--ink); text-decoration:none; letter-spacing:0.04em; }
.nav-back { font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); text-decoration:none; transition:color 0.2s; }
.nav-back:hover { color:var(--ink); }

/* MAIN */
.wrap {
  min-height:calc(100vh - 57px);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:3rem 2rem;
  text-align:center;
  gap:1.5rem;
}

/* TOMATO ILLUSTRATION PLACEHOLDER */
.tomato-wrap {
  display:flex; gap:1rem; align-items:flex-end;
  margin-bottom:0.5rem;
}
.tomato-single {
  position:relative;
  width:60px; height:60px;
}
.tomato-single:nth-child(1) { animation:wobble 3s ease-in-out infinite; }
.tomato-single:nth-child(2) { animation:wobble 3s ease-in-out 0.4s infinite; }
.tomato-single:nth-child(3) { animation:wobble 3s ease-in-out 0.8s infinite; }
.tomato-placeholder {
  width:60px; height:60px;
  display:flex; align-items:center; justify-content:center;
  font-size:36px;
  line-height:1;
  /* Replace this with your hand-drawn tomato illustration:
     <img src="tomato-404.png" alt="Dancing Tomato" style="width:100%;height:100%;object-fit:contain;"> */
}
.tomato-shadow {
  position:absolute; bottom:-12px; left:50%;
  transform:translateX(-50%);
  width:80px; height:10px;
  background:rgba(42,53,64,0.08);
  border-radius:50%;
  animation:shadow 3s ease-in-out infinite;
}

/* TEXT */
.error-num {
  font-family:var(--serif);
  font-size:clamp(4rem,12vw,8rem);
  font-weight:400;
  color:var(--border);
  line-height:1;
  letter-spacing:-0.02em;
}
.error-title {
  font-family:var(--serif);
  font-size:clamp(1.4rem,3vw,2rem);
  font-weight:400;
  color:var(--ink);
  line-height:1.2;
}
.error-title em { font-style:italic; color:var(--accent); }
.error-sub {
  font-size:0.9rem;
  color:var(--muted);
  line-height:1.8;
  max-width:360px;
}

/* LINKS */
.error-links {
  display:flex; gap:1.5rem; align-items:center;
  flex-wrap:wrap; justify-content:center;
  margin-top:0.5rem;
}
.btn-home {
  font-size:0.75rem; letter-spacing:0.14em; text-transform:uppercase;
  background:var(--ink); color:#fff; border:none;
  padding:0.9rem 2rem; cursor:pointer; font-family:var(--sans);
  font-weight:400; text-decoration:none; display:inline-block;
  transition:background 0.2s;
}
.btn-home:hover { background:var(--accent); }
.btn-ghost {
  font-size:0.75rem; letter-spacing:0.14em; text-transform:uppercase;
  background:none; color:var(--ink); border-bottom:1px solid var(--ink);
  padding-bottom:2px; cursor:pointer; font-family:var(--sans);
  font-weight:300; text-decoration:none;
  transition:color 0.2s, border-color 0.2s;
}
.btn-ghost:hover { color:var(--accent); border-color:var(--accent); }

/* FOOTER */
footer {
  border-top:0.5px solid var(--border);
  padding:1rem 2.5rem;
  display:flex; align-items:center; justify-content:space-between;
}
footer p { font-size:0.75rem; color:var(--muted); }

/* ANIMATIONS */
@keyframes wobble {
  0%, 100% { transform:rotate(-2deg) translateY(0); }
  25%       { transform:rotate(2deg) translateY(-8px); }
  50%       { transform:rotate(-1deg) translateY(0); }
  75%       { transform:rotate(3deg) translateY(-4px); }
}
@keyframes shadow {
  0%, 100% { transform:translateX(-50%) scaleX(1); opacity:0.5; }
  25%       { transform:translateX(-50%) scaleX(0.7); opacity:0.2; }
  75%       { transform:translateX(-50%) scaleX(0.85); opacity:0.3; }
}

/* MOBILE */
@media(max-width:600px) {
  nav { padding:1rem 1.5rem; }
  .tomato-placeholder { font-size:30px; width:50px; height:50px; }
  .tomato-wrap { width:50px; height:50px; }
  .error-links { flex-direction:column; gap:1rem; }
  footer { padding:1rem 1.5rem; }
}
</style>
</head>
<body>

<nav>
  <a href="/index.html" class="nav-logo">Dancing Tomato Studio</a>
  <a href="/index.html" class="nav-back">← Home</a>
</nav>

<div class="wrap">

  <div class="tomato-wrap">
    <div class="tomato-single">
      <div class="tomato-placeholder">🍅</div>
      <div class="tomato-shadow"></div>
    </div>
    <div class="tomato-single">
      <div class="tomato-placeholder">🍅</div>
      <div class="tomato-shadow"></div>
    </div>
    <div class="tomato-single">
      <div class="tomato-placeholder">🍅</div>
      <div class="tomato-shadow"></div>
    </div>
  </div>

  <p class="error-num">404</p>

  <h1 class="error-title">Nothing here but<br><em>us tomatoes</em></h1>

  <p class="error-sub">The page you're looking for has wandered off. It happens to the best of us. Head back home and we'll get you sorted.</p>

  <div class="error-links">
    <a href="/index.html" class="btn-home">Back to home</a>
    <a href="/index.html#contact" class="btn-ghost">Get in touch</a>
  </div>

</div>

<footer>
  <p>© 2026 Dancing Tomato Studio &nbsp;·&nbsp; Portland, Maine</p>
</footer>

</body>
</html>
